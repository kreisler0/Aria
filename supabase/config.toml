# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard; see README.md.
project_id = "aria"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["aria://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Local stacks have no mail server; hosted projects should keep confirmations on.
enable_confirmations = false

# iCloud Calendar sync. pg_cron calls it without a user token, so the gateway's JWT check is
# off; the function verifies the caller itself (user token, or pg_cron's private token).
[functions.icloud-sync]
verify_jwt = false
