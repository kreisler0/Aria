# XcodeGen spec for the Aria iOS/iPadOS app and its widget extension.
# The generated Aria.xcodeproj is committed; regenerate after changing this file:
#   brew install xcodegen && xcodegen generate   (run in ios/)
name: Aria
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(ARIA_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  AriaKit:
    path: AriaKit
targets:
  Aria:
    type: application
    platform: iOS
    sources:
      - path: AriaApp
      - path: Shared
    dependencies:
      - package: AriaKit
      - target: AriaWidgets
    info:
      path: AriaApp/Info.plist
      properties:
        CFBundleDisplayName: Aria
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: Aria syncs your events with the Calendar app, so plans you or the assistant make show up everywhere.
        NSCalendarsUsageDescription: Aria syncs your events with the Calendar app, so plans you or the assistant make show up everywhere.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - aria.refresh
        CFBundleURLTypes:
          - CFBundleURLName: aria
            CFBundleURLSchemes:
              - aria
        AriaAppGroup: $(ARIA_APP_GROUP)
        AriaSupabaseURL: $(ARIA_SUPABASE_URL)
        AriaSupabaseAnonKey: $(ARIA_SUPABASE_ANON_KEY)
    entitlements:
      path: AriaApp/Aria.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ARIA_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ARIA_BUNDLE_ID)
        PRODUCT_NAME: Aria
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ARIA_APP
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  AriaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AriaWidgets
      - path: Shared
    dependencies:
      - package: AriaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: AriaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aria
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AriaAppGroup: $(ARIA_APP_GROUP)
        AriaSupabaseURL: $(ARIA_SUPABASE_URL)
        AriaSupabaseAnonKey: $(ARIA_SUPABASE_ANON_KEY)
    entitlements:
      path: AriaWidgets/AriaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ARIA_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ARIA_BUNDLE_ID).widgets
        PRODUCT_NAME: AriaWidgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ARIA_WIDGETS
        SKIP_INSTALL: YES
schemes:
  Aria:
    build:
      targets:
        Aria: all
        AriaWidgets: all
    run:
      config: Debug
    archive:
      config: Release
